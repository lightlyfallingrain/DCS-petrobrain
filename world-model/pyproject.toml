[project]
name = "dcs-world-model"
version = "0.1.0"
description = "Persistent, queryable semantic geographic model of DCS World theatres"
requires-python = ">=3.11"
dependencies = [
    "pyproj>=3.6",
    "pillow>=9.1",
    # M9 decision: parses Geofabrik .osm.pbf extracts (src/osm/pbf.py). The
    # project is named "pyosmium" (pyosmium.org) but its PyPI distribution
    # and import name are both "osmium" -- confirmed against the real
    # PyPI JSON API during M9 implementation (a plain `pip install
    # pyosmium` 404s; `pip install osmium` is correct). Ships cp314 wheels
    # for macOS arm64/x86_64, manylinux and Windows as of 4.3.1.
    "osmium>=4.3",
    # landform-geomorphons: vectorized geomorphons classification
    # (terrain.geomorphons), DCS-lattice SRTM resampling
    # (terrain.resample), and mask/closing/Zhang-Suen-thinning
    # (terrain.skeleton's scipy.ndimage.binary_closing) -- replaces the
    # retired marker-controlled-watershed mechanism's terrain.curvature
    # (deleted), which previously held this comment. The junction-walking
    # tracer and basin-free geometry wrapping in terrain.features/
    # terrain.skeleton stay stdlib; this is not blanket permission to
    # reach for numpy elsewhere in world-model.
    # Pinned below 2.5: numpy 2.5's bundled stubs adopted PEP 695 `type`
    # statements unconditionally, which mypy's parser rejects outright
    # under this project's `python_version = "3.11"` target -- confirmed
    # during terrain-feature-probing Stage 1 (2.2.x/2.3.x/2.4.x stubs are
    # clean; 2.5.3 is not). Revisit this ceiling once `python_version` ever
    # moves to 3.12+, not before.
    "numpy>=1.26,<2.5",
    "scipy>=1.11",
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src:tests"

[[tool.mypy.overrides]]
# scipy ships no bundled type stubs; its PyPI-published `scipy-stubs`
# package (unlike numpy's own bundled ones) uses PEP 695 `type` statements
# unconditionally, which mypy's syntax layer rejects outright under this
# project's `python_version = "3.11"` target (a parse error, not a type
# error, so it cannot be narrowed to one module) -- confirmed against
# scipy-stubs 1.18.1.1 during terrain-feature-probing Stage 1. `terrain.
# curvature` is the only caller (`scipy.ndimage.uniform_filter`/
# `minimum_filter`, both thin, narrow calls), so untyped-import is an
# accepted, scoped gap rather than a reason to loosen `strict` project-wide.
module = "scipy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.isort]
# Ruff's isort auto-detects first-party packages from a `src` root relative
# to wherever it resolves the project root to be. When invoked with paths
# from the repo root (e.g. `ruff check world-model/src world-model/tests`,
# the canonical command per world-model/CLAUDE.md), that resolution differs
# from invoking with cwd=world-model/, causing local packages (`coordinates`,
# `raster`, `control_points`) to flip between "first-party" and "third-party"
# import-sort buckets depending on invocation cwd -- the root cause of a
# recurring I001 finding across M1/M2 sessions (see
# world-model/research/2026-09-03-m2-rastercharts-recon.md session 12 and
# plans/m2-raster-understanding/implementation.md). Declaring these
# explicitly makes the classification invocation-cwd-independent.
known-first-party = [
    "coordinates",
    "raster",
    "control_points",
    "elevation",
    "osm",
    "geometry",
    "dcs_data",
    "store",
    "build",
    "query",
    "roadnet",
    "terrain",
    "api",
]
